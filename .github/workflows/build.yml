
name: AtlasKasa - JAR Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build AtlasKasa
        run: mvn -B clean package

      - name: Upload AtlasKasa JAR
        uses: actions/upload-artifact@v4
        with:
          name: AtlasKasa-JAR
          path: target/AtlasKasa.jar
          if-no-files-found: error
          retention-days: 30
